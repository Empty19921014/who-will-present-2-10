<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>오늘의 발표자 뽑기</title>
  <style>
    :root{--ink:#172033;--muted:#687087;--paper:#fffdf8;--line:#e8e3d8;--yellow:#ffd84d;--orange:#ff8a3d;--blue:#5978f3;--mint:#48c9a5;--red:#ee5c68;--shadow:0 18px 50px rgba(28,35,54,.12)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:#fff}
    button,input,textarea{font:inherit} button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.brand small{font-weight:900;color:var(--orange);letter-spacing:.12em}.brand h1{margin:7px 0 4px;font-size:clamp(30px,5vw,55px);line-height:1;letter-spacing:-.055em}.brand p{margin:9px 0;color:var(--muted)}.date-card{background:var(--ink);color:white;padding:16px 20px;border-radius:18px;min-width:210px;box-shadow:8px 8px 0 var(--yellow);font-weight:800}.date-card small{display:block;color:#bcc5db;margin-bottom:5px}
    .grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);gap:18px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:24px;box-shadow:0 12px 36px rgba(28,35,54,.09)}.stage{min-height:590px;padding:28px;position:relative;overflow:hidden}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}.status{font-size:13px;font-weight:800;padding:7px 11px;border-radius:999px;background:#edf4ef;color:#315e48}
    .idle{min-height:380px;display:grid;place-items:center;text-align:center;position:relative}.idle-icon{font-size:76px;filter:drop-shadow(5px 7px 0 #ffe78d)}.idle h2{font-size:28px;margin:14px 0 8px}.idle p{color:var(--muted);line-height:1.7}.draw{border:0;border-radius:18px;padding:18px 34px;background:var(--yellow);color:var(--ink);font-weight:1000;font-size:20px;box-shadow:0 7px 0 #d8ad13;transition:.15s transform}.draw:hover{transform:translateY(-2px)}.draw:active{transform:translateY(5px);box-shadow:0 2px 0 #d8ad13}.draw:disabled{opacity:.55;cursor:not-allowed}
    .live-board{margin:26px 0 18px;min-height:480px;border:13px solid #95603b;border-radius:8px;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.04) 0 1px,transparent 2px),radial-gradient(circle at 75% 65%,rgba(255,255,255,.03) 0 1px,transparent 2px),#174d3a;background-size:21px 19px,27px 23px;color:#f6f2df;padding:26px 38px;position:relative;box-shadow:inset 0 0 35px rgba(0,0,0,.46),0 8px 0 #724426,0 13px 22px rgba(34,25,18,.2)}.live-board:before{content:"";position:absolute;left:6%;right:6%;bottom:9px;height:4px;background:rgba(246,242,223,.16);filter:blur(1px)}.board-inner{width:100%;height:400px;display:grid;grid-template-rows:auto 1fr}.live-label{color:rgba(246,242,223,.58);font-size:12px;font-weight:800;letter-spacing:.16em;border-bottom:1px solid rgba(246,242,223,.2);padding-bottom:7px;width:100%;text-align:left}.board-lines{height:360px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 0}.chalk-line{flex:0 0 auto;width:100%;min-height:190px;display:grid;align-content:center;transition:opacity .6s,filter .6s;padding:5px 0}.chalk-line.done{min-height:67px;opacity:.58;filter:saturate(.55);border-bottom:1px dashed rgba(246,242,223,.13)}.live-name{margin:5px 0 10px;color:#ffe991;font-family:"나눔손글씨 펜","Nanum Pen Script","휴먼편지체","Malgun Gothic",sans-serif;font-size:clamp(21px,3vw,29px);font-weight:700;letter-spacing:.02em;text-align:center}.equation-row{width:100%;min-height:115px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:8px 18px}.live-formula,.live-value{white-space:pre-wrap;font-family:"나눔손글씨 펜","Nanum Pen Script","휴먼편지체","Malgun Gothic",sans-serif;text-shadow:0 0 1px rgba(255,255,255,.9),1px 1px 1px rgba(255,255,255,.18);line-height:1.25}.live-formula{font-size:clamp(30px,5.3vw,57px);font-weight:700;word-break:keep-all}.equals{display:inline-block;color:rgba(246,242,223,.72);font:700 clamp(29px,4.5vw,50px)/1 "Malgun Gothic",sans-serif}.live-value{color:#ffe991;font-size:clamp(38px,6vw,66px);font-weight:800;min-width:1ch}.chalk-line.done .live-name{margin:0 0 2px;font-size:14px;text-align:left;color:rgba(255,233,145,.7)}.chalk-line.done .equation-row{min-height:31px;justify-content:flex-start;gap:6px}.chalk-line.done .live-formula,.chalk-line.done .live-value,.chalk-line.done .equals{font-size:20px;color:rgba(246,242,223,.78)}.chalk-char{display:inline-block;opacity:0;clip-path:inset(0 100% 0 0);filter:blur(2px);animation:chalkStroke .42s cubic-bezier(.22,.75,.3,1) forwards}.chalk-space{width:.32em}@keyframes chalkStroke{0%{opacity:.1;clip-path:inset(0 100% 0 0);filter:blur(2.5px);transform:translate(-2px,1px) rotate(-1deg)}55%{opacity:.72;filter:blur(.7px)}100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0);transform:none}}.live-value.pulse{animation:chalkPop .45s}@keyframes chalkPop{50%{transform:scale(1.1);text-shadow:0 0 8px rgba(255,233,145,.6)}}
    .history-wrap{margin-top:26px}.history-wrap h3{margin:0 0 11px;font-size:16px}.steps{display:grid;gap:8px}.step{opacity:0;transform:translateY(12px);background:#f8faf8;border:1px solid #dfe8e2;border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:32px 1fr;gap:11px;transition:.45s}.step.show{opacity:1;transform:none}.step .num{width:30px;height:30px;border-radius:9px;background:#dfeee5;color:#276049;display:grid;place-items:center;font-size:13px;font-weight:900}.step.special{border-color:#ffc4c9;background:#fff7f8}.step.special .num{background:#ffe3e6;color:var(--red)}.step b{display:block;margin-bottom:4px;font-size:14px}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#424c64;font-size:13px;word-break:break-word}.winner{display:none;text-align:center;padding:28px 12px 8px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}.winner.show{display:block}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}.winner .badge{display:inline-block;background:var(--yellow);padding:6px 12px;border-radius:999px;font-weight:900}.winner .ball{width:142px;height:142px;margin:14px auto;border-radius:50%;background:linear-gradient(135deg,var(--orange),#ff5c66);color:white;display:grid;place-items:center;font-size:66px;font-weight:1000;box-shadow:0 12px 0 #d83d49}.winner h2{font-size:30px;margin:20px 0 4px}.winner p{color:var(--muted);margin:0}.actions{display:flex;justify-content:center;gap:9px;margin-top:18px}.secondary{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;font-weight:800}.secondary:hover{border-color:var(--blue);color:var(--blue)}
    .side{display:grid;gap:18px;align-content:start}.panel{padding:20px}.panel h3{margin:0 0 6px;font-size:18px}.panel>p{margin:0 0 15px;font-size:13px;color:var(--muted);line-height:1.5}.numbers{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.nbtn{aspect-ratio:1;border:1px solid var(--line);background:white;border-radius:9px;font-size:12px;font-weight:900;color:var(--ink)}.nbtn:hover{border-color:var(--red)}.nbtn.off{background:var(--red);color:white;border-color:var(--red);text-decoration:line-through}.panel-title{display:flex;justify-content:space-between;align-items:center}.count{font-size:12px;color:var(--muted);font-weight:800}.roster{width:100%;height:150px;resize:vertical;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;line-height:1.55;font-size:13px;outline:none}.roster:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e7ebff}.save{width:100%;border:0;background:var(--ink);color:white;border-radius:12px;padding:11px;margin-top:8px;font-weight:900}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:white;border-radius:12px;padding:11px 16px;opacity:0;pointer-events:none;transition:.3s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:820px){.top{display:block}.date-card{margin-top:18px}.grid{grid-template-columns:1fr}.stage{min-height:540px;padding:20px}.side{grid-template-columns:1fr}.wrap{padding:20px 12px 40px}.live-board{min-height:430px;padding:20px 16px}.board-inner{height:350px}.board-lines{height:315px}.chalk-line{min-height:170px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="brand"><small>PRESENTER PICK</small><h1>오늘의 발표자</h1><p>오늘 날짜로 발표자를 정해요.</p></div><div class="date-card"><small>오늘 날짜</small><span id="dateText"></span></div></header>
  <div class="grid">
    <section class="card stage" aria-live="polite"><div class="stage-head"><strong>발표자 뽑기</strong><span class="status" id="status">준비</span></div><div id="showArea"></div></section>
    <aside class="side">
      <section class="card panel"><div class="panel-title"><h3>🚫 결석자</h3><span class="count" id="absentCount">0명 제외</span></div><p>결석한 학생의 번호를 누르세요.</p><div class="numbers" id="numbers"></div></section>
      <section class="card panel"><h3>📝 명렬표</h3><p>1번부터 한 줄에 한 명씩 입력하세요.</p><textarea class="roster" id="roster" maxlength="900" placeholder="김하늘&#10;이바다&#10;박새봄&#10;..."></textarea><button class="save" id="saveRoster">저장</button></section>
    </aside>
  </div>
</main><div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  // ---------- 상태와 날짜 ----------
  const MAX=30, $=s=>document.querySelector(s), now=new Date();
  const DEFAULT_ROSTER=['강지윤','김시은','박서진','박수빈','변채윤','백린서','손세빈','윤예원','유은서','윤채빈','이다빈','이예인','임주아','정유나','정인지','황준서','권형빈','김영운','김찬형','남윤호','남태윤','박서준','박재영','손승현','이연','이준서','이화준','최현서','황준환','황지후'];
  const date={year:now.getFullYear(),month:now.getMonth()+1,day:now.getDate()};
  const savedRoster=localStorage.getItem('mathPickerRoster');
  const state={excluded:new Set(JSON.parse(localStorage.getItem('mathPickerExcluded')||'[]')), roster:savedRoster===null?[...DEFAULT_ROSTER]:JSON.parse(savedRoster), steps:[],winner:null,running:false,timers:[]};
  $('#dateText').textContent=`${date.year}년 ${date.month}월 ${date.day}일`;

  // ---------- 안전한 정수 수학 도구 ----------
  const clamp=n=>Number.isFinite(n)?Math.max(-1e9,Math.min(1e9,Math.trunc(n))):0;
  const digits=n=>String(Math.abs(clamp(Number(n)))).split('').map(Number);
  const digitSum=n=>digits(n).reduce((a,b)=>a+b,0), digitProduct=n=>digits(n).reduce((a,b)=>a*b,1);
  const gcd=(a,b)=>{a=Math.abs(clamp(a));b=Math.abs(clamp(b));while(b)[a,b]=[b,a%b];return a};
  const lcm=(a,b)=>a&&b?Math.abs(clamp(a*b))/gcd(a,b):0;
  const divisors=n=>{n=Math.max(1,Math.abs(clamp(n)));const a=[];for(let i=1;i<=Math.sqrt(n);i++)if(n%i===0){a.push(i);if(i*i!==n)a.push(n/i)}return a.sort((x,y)=>x-y)};
  const factors=n=>{n=Math.max(2,Math.abs(clamp(n)));const a=[];for(let p=2;p*p<=n;p++)while(n%p===0){a.push(p);n/=p}if(n>1)a.push(n);return a};
  const isPrime=n=>{n=clamp(n);if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};
  const nthPrime=n=>{n=Math.max(1,Math.min(50,Math.abs(clamp(n))));let x=1,c=0;while(c<n){x++;if(isPrime(x))c++}return x};
  const primeCount=n=>{n=Math.min(5000,Math.abs(clamp(n)));let c=0;for(let i=2;i<=n;i++)if(isPrime(i))c++;return c};
  const phi=n=>{n=Math.max(1,Math.abs(clamp(n)));let r=n,x=n;for(let p=2;p*p<=x;p++)if(x%p===0){while(x%p===0)x/=p;r-=r/p}if(x>1)r-=r/x;return clamp(r)};
  const fib=n=>{n=Math.max(0,Math.min(40,Math.abs(clamp(n))));let a=0,b=1;while(n--)[a,b]=[b,a+b];return a};
  const rev=n=>Number(String(Math.abs(clamp(n))).split('').reverse().join(''))||0;
  const evenDigits=n=>digits(n).filter(x=>x%2===0).reduce((a,b)=>a+b,0), oddDigits=n=>digits(n).filter(x=>x%2).reduce((a,b)=>a+b,0);
  const natural=n=>{n=Math.abs(clamp(n));if(n>=1&&n<=MAX)return {value:n,note:''};let v=n;const trail=[];for(let i=0;i<12&&v>MAX;i++){if(v>=100){const q=digitSum(v);trail.push(`${v}의 자리수 합 = ${q}`);v=q}else{const q=v-MAX;trail.push(`${v} - 30 = ${q}`);v=q}}if(v<1){const raw=digitSum(date.year)+date.month+date.day;v=raw;trail.push(`${date.year}년 자리수 합 ${digitSum(date.year)} + ${date.month}월 + ${date.day}일 = ${raw}`);while(v>MAX){const q=v-MAX;trail.push(`${v} - 30 = ${q}`);v=q}}return {value:v,note:trail.join(' → ')}};
  const pick=a=>a[Math.floor(Math.random()*a.length)], weighted=()=>{const r=Math.random();return r<.48?'basic':r<.80?'special':r<.95?'advanced':'weird'};
  const safe=(fn,fallback)=>{try{const n=fn();return Number.isFinite(n)?clamp(n):fallback}catch{return fallback}};

  // 모든 연산은 결과·식·이름을 반환하는 독립 함수다.
  const OPS={
    basic:[
      (v)=>({name:'오늘의 월을 더하기',formula:`${v} + ${date.month}월`,value:v+date.month}),
      (v)=>({name:'오늘의 일을 더하기',formula:`${v} + ${date.day}일`,value:v+date.day}),
      (v)=>({name:'오늘의 월을 곱하기',formula:`${v} × ${date.month}월`,value:v*date.month}),
      (v)=>({name:'제곱한 뒤 오늘의 월 더하기',formula:`${v}² + ${date.month}월`,value:v*v+date.month}),
      (v)=>({name:'날짜 자리수 합 더하기',formula:`${v} + 날짜 자리수 합 ${digitSum(`${date.year}${String(date.month).padStart(2,'0')}${String(date.day).padStart(2,'0')}`)}`,value:v+digitSum(`${date.year}${String(date.month).padStart(2,'0')}${String(date.day).padStart(2,'0')}`)}),
      (v)=>({name:'연도 자리수 합 더하기',formula:`${v} + (${digits(date.year).join(' + ')})`,value:v+digitSum(date.year)})
    ],
    special:[
      v=>({name:'현재 값과 오늘 일의 최대공약수',formula:`GCD(${Math.abs(v)}, ${date.day}일)`,value:gcd(v,date.day)}),
      v=>({name:'현재 값과 오늘 월의 최소공배수',formula:`LCM(${Math.max(1,Math.abs(v))}, ${date.month}월)`,value:lcm(v,date.month)}),
      v=>({name:'약수의 개수',formula:`${Math.max(1,Math.abs(v))}의 약수 개수`,value:divisors(v).length}),
      v=>({name:'약수의 합',formula:`${Math.max(1,Math.abs(v))}의 약수 합`,value:divisors(v).reduce((a,b)=>a+b,0)}),
      v=>({name:'자리수 곱',formula:`${Math.abs(v)}의 자리수 곱`,value:digitProduct(v)}),
      v=>({name:'숫자 뒤집기',formula:`${Math.abs(v)}를 뒤집기`,value:rev(v)}),
      v=>({name:'짝수 자리 합',formula:`${Math.abs(v)}의 짝수 자리만 합`,value:evenDigits(v)}),
      v=>({name:'홀수 자리 합',formula:`${Math.abs(v)}의 홀수 자리만 합`,value:oddDigits(v)}),
      v=>({name:'큰 자리와 작은 자리',formula:`max(${digits(v)}) + min(${digits(v)})`,value:Math.max(...digits(v))+Math.min(...digits(v))}),
      v=>({name:'소인수의 합',formula:`${Math.max(2,Math.abs(v))}의 소인수 ${factors(v).join('+')}`,value:factors(v).reduce((a,b)=>a+b,0)})
    ],
    advanced:[
      v=>({name:'제곱근에 오늘의 월 더하기',formula:`⌊√${Math.abs(v)}⌋ + ${date.month}월`,value:Math.floor(Math.sqrt(Math.abs(v)))+date.month}),
      v=>({name:'현재 값을 제곱하기',formula:`${Math.abs(v)}²`,value:Math.abs(v)**2}),
      v=>({name:'오일러 피 함수',formula:`φ(${Math.max(1,Math.abs(v))})`,value:phi(v)}),
      v=>({name:'삼각수',formula:`T(${Math.abs(v)}) = ${Math.abs(v)} × ${Math.abs(v)+1} ÷ 2`,value:Math.abs(v)*(Math.abs(v)+1)/2})
    ],
    weird:[
      v=>({name:'완전제곱 탐색',formula:`${Math.abs(v)} 다음 완전제곱의 제곱근`,value:Math.ceil(Math.sqrt(Math.abs(v)))}),
      v=>({name:'소인수 개수에 오늘의 월 곱하기',formula:`${Math.max(2,Math.abs(v))}의 소인수 개수 × ${date.month}월`,value:factors(v).length*date.month}),
      v=>({name:'짝수 자리 합과 홀수 자리 합의 차',formula:`|${evenDigits(v)} - ${oddDigits(v)}| + ${date.day}일`,value:Math.abs(evenDigits(v)-oddDigits(v))+date.day})
    ]
  };

  function buildCalculation(){
    const seeds=[{label:'오늘의 일',value:date.day,formula:`오늘은 ${date.day}일`},{label:'월 + 일',value:date.month+date.day,formula:`${date.month}월 + ${date.day}일`},{label:'연도 자리수 합',value:digitSum(date.year),formula:`${date.year}년의 자리수 합`},{label:'날짜 숫자 합',value:digitSum(`${date.year}${date.month}${date.day}`),formula:`${date.year}년 ${date.month}월 ${date.day}일의 자리수 합`}];
    const seed=pick(seeds),steps=[{name:`출발 재료 · ${seed.label}`,formula:seed.formula,from:null,value:seed.value,result:`${seed.value}에서 시작합니다`}];let v=seed.value;
    const length=1+Math.floor(Math.random()*4);
    for(let i=0;i<length;i++){const before=v;let cat,r,tries=0;do{cat=weighted();r=pick(OPS[cat])(v);tries++}while((!Number.isFinite(r.value)||!Number.isInteger(r.value)||Math.abs(r.value)>1e9)&&tries<30);if(!Number.isFinite(r.value)||!Number.isInteger(r.value)||Math.abs(r.value)>1e9){cat='basic';r={name:'오늘의 월을 더하기',formula:`${v} + ${date.month}월`,value:v+date.month}}v=clamp(r.value);steps.push({...r,from:before,result:`${before}에서 이어진 계산값 ${v}`,category:cat})}
    const beforeConverge=v,converge=natural(v);v=converge.value;if(converge.note)steps.push({name:'번호 계산',formula:converge.note,from:beforeConverge,value:v,result:`${v}번`});
    // 제외자면 숨은 난수 없이 바로 다음 번호를 계산한다.
    if(state.excluded.size>=MAX) throw new Error('모든 학생이 제외되어 있습니다.');
    let guard=0;
    while(state.excluded.has(v)&&guard++<MAX){const old=v;v=old===30?1:old+1;steps.push({name:`${old}번 학생이 결석이라 다음 번호 확인`,formula:old===30?'30번 다음은 1번':`${old} + 1`,from:old,value:v,result:`다음 후보는 ${v}번`,special:true})}
    return {steps,winner:v};
  }

  // ---------- 화면과 순차 쇼 ----------
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function idle(){state.timers.forEach(clearTimeout);state.timers=[];$('#status').textContent='준비';$('#showArea').innerHTML=`<div class="idle"><div><div class="idle-icon">🎲</div><h2>오늘은 누가 발표할까요?</h2><button class="draw" id="drawBtn">발표자 뽑기</button></div></div>`;$('#drawBtn').onclick=draw}
  function draw(){if(state.running)return;try{const c=buildCalculation();state.steps=c.steps;state.winner=c.winner;play()}catch(e){toast(e.message)}}
  function writeChalk(el,text,speed=95,done){el.textContent='';[...String(text)].forEach((char,i)=>{const span=document.createElement('span');span.className='chalk-char'+(char===' '?' chalk-space':'');span.textContent=char===' '?'\u00a0':char;span.style.animationDelay=`${i*speed}ms`;el.append(span)});const end=setTimeout(()=>{if(done)done()},String(text).length*speed+460);state.timers.push(end)}
  function addBoardLine(s){const lines=$('#boardLines'),previous=[...lines.children];previous.forEach(line=>line.classList.remove('active'));const line=document.createElement('div');line.className='chalk-line active';line.innerHTML=`<div class="live-name">${esc(s.name)}</div><div class="equation-row"><span class="live-formula"></span><span class="equals">=</span><span class="live-value"></span></div>`;lines.append(line);requestAnimationFrame(()=>{previous.forEach(old=>{old.classList.add('done');old.animate([{transform:'translateY(70px)'},{transform:'translateY(0)'}],{duration:720,easing:'cubic-bezier(.2,.8,.25,1)'})});line.animate([{opacity:0,transform:'translateY(65px)'},{opacity:1,transform:'translateY(0)'}],{duration:720,easing:'cubic-bezier(.2,.8,.25,1)'})});return {formula:line.querySelector('.live-formula'),value:line.querySelector('.live-value')}}
  function addHistory(s,i){const el=document.createElement('div');el.className=`step${s.special?' special':''}`;el.innerHTML=`<div class="num">${i+1}</div><div><b>${esc(s.name)}</b><div class="formula">${esc(s.formula)} = ${esc(s.value)}</div></div>`;$('#steps').append(el);requestAnimationFrame(()=>el.classList.add('show'))}
  function play(){state.timers.forEach(clearTimeout);state.timers=[];state.running=true;$('#status').textContent='계산 중…';$('#showArea').innerHTML='<div class="live-board"><div class="board-inner"><div class="live-label">TODAY\'S PICK</div><div class="board-lines" id="boardLines"></div></div></div><div class="history-wrap"><h3>전체 계산 과정</h3><div class="steps" id="steps"></div></div><div class="winner" id="winner"></div>';
    let cursor=0;state.steps.forEach((s,i)=>{const stepDuration=Math.max(4200,String(s.formula).length*95+String(s.value).length*230+1200);const t=setTimeout(()=>{const current=addBoardLine(s);writeChalk(current.formula,s.formula,95,()=>writeChalk(current.value,s.value,230,()=>{current.value.classList.add('pulse');addHistory(s,i);const pulse=setTimeout(()=>current.value?.classList.remove('pulse'),480);state.timers.push(pulse)}))},cursor);state.timers.push(t);cursor+=stepDuration});
    state.timers.push(setTimeout(()=>{const name=state.roster[state.winner-1]?.trim();$('#winner').innerHTML=`<span class="badge">🎉 오늘의 발표자</span><div class="ball">${state.winner}</div><h2>${name?esc(name)+' 학생':state.winner+'번 학생'}</h2><div class="actions"><button class="secondary" id="replay">↻ 다시 보기</button><button class="secondary" id="again">🎲 다시 뽑기</button></div>`;$('#winner').classList.add('show');$('#status').textContent='완료';state.running=false;$('#replay').onclick=play;$('#again').onclick=draw;$('#winner').scrollIntoView({behavior:'smooth',block:'center'})},cursor+550))}
  function renderNumbers(){const box=$('#numbers');box.innerHTML='';for(let i=1;i<=MAX;i++){const b=document.createElement('button'),name=state.roster[i-1]?.trim();b.className='nbtn'+(state.excluded.has(i)?' off':'');b.textContent=i;b.title=name?`${i}번 ${name}`:`${i}번`;b.setAttribute('aria-label',name?`${i}번 ${name}`:`${i}번`);b.setAttribute('aria-pressed',state.excluded.has(i));b.onclick=()=>{state.excluded.has(i)?state.excluded.delete(i):state.excluded.add(i);localStorage.setItem('mathPickerExcluded',JSON.stringify([...state.excluded]));renderNumbers()};box.append(b)}$('#absentCount').textContent=`${state.excluded.size}명 제외`}
  let toastTimer;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
  $('#roster').value=state.roster.join('\n');$('#saveRoster').onclick=()=>{state.roster=$('#roster').value.split(/\r?\n/).slice(0,30);localStorage.setItem('mathPickerRoster',JSON.stringify(state.roster));renderNumbers();toast('명렬표를 이 브라우저에 저장했습니다.')};renderNumbers();idle();
})();
</script>
</body>
</html>
